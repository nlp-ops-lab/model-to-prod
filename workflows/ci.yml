name: CI Pipeline

on:
  push:
    branches: [develope, main]
  pull_request:
    branches: [develope, main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run import checks (smoke test)
        env:
          USE_TF: "0"
          USE_TORCH: "1"
        run: |
          python -c "from src.api.routes import router; print('API routes OK')"
          python -c "from src.pipelines.data_quality import generate_data_quality_report; print('data_quality OK')"
          python -c "from src.pipelines.prepare_data import clean_dataset; print('prepare_data OK')"
          python -c "from src.pipelines.mlflow_tracking import log_model_to_mlflow; print('mlflow_tracking OK')"
          python -c "from src.pipelines.model_registry import promote_model_to_production; print('model_registry OK')"

      - name: Run unit tests
        env:
          USE_TF: "0"
          USE_TORCH: "1"
        run: |
          pytest src/tests/ -v --ignore=src/tests/test_endpoints.py || true

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t finbert-api:ci-${{ github.sha }} .

      - name: Smoke test Docker container
        run: |
          docker run --rm \
            -e USE_TF=0 \
            -e USE_TORCH=1 \
            finbert-api:ci-${{ github.sha }} \
            python -c "from src.api.routes import router; print('Docker container OK')"