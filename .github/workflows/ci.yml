name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
      - develope
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Start FastAPI server
        run: python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API readiness ($attempt/30)"
            sleep 2
          done
          echo "API failed to become ready"
          cat uvicorn.log
          exit 1

      - name: Run API tests
        run: python -m src.tests.test_endpoints

      - name: Compile check
        run: python -m compileall src

      - name: Model sanity check
        run: python -c "from src.services.finbert_service import get_classifier; get_classifier(); print('MODEL LOAD OK')"
