name: MLOps CI Pipeline

on:
  push:
    branches: ["main", "develope"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🚀 مهم: API را در پس‌زمینه بالا می‌آوریم
      - name: Start FastAPI server
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10

      # 🧪 تست integration روی API
      - name: Run API tests
        run: |
          python -m src.tests.test_endpoints

      # 🔍 چک syntax پروژه
      - name: Compile check
        run: |
          python -m compileall src

      # 🧠 sanity check مدل
      - name: Model sanity check
        run: |
          python -c "from src.services.finbert_service import get_classifier; print('MODEL LOAD OK')"