name: CI

on:
  push:
    branches:
      - main
      - develope
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Start API server
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url) as response:
                      if response.status == 200:
                          print("API is ready")
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("API did not become ready in time")
          PY

      - name: Run tests
        run: python -m src.tests.test_endpoints

      - name: Compile check
        run: python -m compileall src

      - name: Model sanity check
        run: python -c "from src.services.finbert_service import get_classifier; get_classifier(); print('MODEL LOAD OK')"
